<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAdmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ================= AUTH VIEW ================= -->
    <section id="authView" class="auth-view" hidden>
        <div class="auth-card">
            <div class="brand">
                <span class="brand-logo">S</span>
                <span class="brand-name">ShopAdmin</span>
            </div>

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" data-tab="login">Log in</button>
                <button type="button" class="auth-tab" data-tab="register">Sign up</button>
            </div>

            <form id="loginForm" class="form">
                <label>Email
                    <input type="email" name="email" required autocomplete="username">
                </label>
                <label>Password
                    <input type="password" name="password" required autocomplete="current-password">
                </label>
                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>

            <form id="registerForm" class="form" hidden>
                <label>Full name
                    <input type="text" name="fullName" required>
                </label>
                <div class="form-row">
                    <label>Age
                        <input type="number" name="age" min="1" max="150" required>
                    </label>
                    <label>Gender
                        <select name="gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </label>
                </div>
                <label>Email
                    <input type="email" name="email" required autocomplete="username">
                </label>
                <label>Password
                    <input type="password" name="password" required minlength="6" autocomplete="new-password">
                </label>
                <label>Account type
                    <select name="type" required>
                        <option value="normal">Normal user</option>
                        <option value="admin">Admin</option>
                    </select>
                </label>
                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </form>
        </div>
    </section>

    <!-- ================= APP VIEW ================= -->
    <div id="appView" class="app-view" hidden>
        <header class="topbar">
            <div class="brand">
                <span class="brand-logo">S</span>
                <span class="brand-name">ShopAdmin</span>
            </div>
            <nav class="nav" id="nav">
                <button type="button" class="nav-link active" data-page="products">Products</button>
                <button type="button" class="nav-link" data-page="categories">Categories</button>
                <button type="button" class="nav-link" data-page="profile">My profile</button>
            </nav>
            <div class="user-chip">
                <img id="headerAvatar" class="avatar avatar-sm" alt="">
                <div class="user-chip-text">
                    <span id="headerName" class="user-name"></span>
                    <span id="headerRole" class="role-badge"></span>
                </div>
                <button type="button" id="logoutBtn" class="btn btn-ghost btn-sm">Log out</button>
            </div>
        </header>

        <main class="content">
            <!-- Products -->
            <section id="page-products" class="page">
                <div class="page-header">
                    <h1>Products</h1>
                    <div class="toolbar">
                        <select id="productFilter" aria-label="Filter by category">
                            <option value="">All categories</option>
                        </select>
                        <button type="button" id="addProductBtn" class="btn btn-primary">+ Add product</button>
                    </div>
                </div>
                <div class="card table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th class="num">Quantity</th>
                                <th class="num">Price</th>
                                <th class="actions-col"></th>
                            </tr>
                        </thead>
                        <tbody id="productRows"></tbody>
                    </table>
                    <p id="productEmpty" class="empty" hidden></p>
                </div>
            </section>

            <!-- Categories -->
            <section id="page-categories" class="page" hidden>
                <div class="page-header">
                    <h1>Categories</h1>
                    <div class="toolbar">
                        <button type="button" id="addCategoryBtn" class="btn btn-primary">+ Add category</button>
                    </div>
                </div>
                <div class="card table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th class="actions-col"></th>
                            </tr>
                        </thead>
                        <tbody id="categoryRows"></tbody>
                    </table>
                    <p id="categoryEmpty" class="empty" hidden></p>
                </div>
            </section>

            <!-- Profile -->
            <section id="page-profile" class="page" hidden>
                <div class="page-header">
                    <h1>My profile</h1>
                </div>
                <div class="profile-grid">
                    <div class="card avatar-card">
                        <img id="profileAvatar" class="avatar avatar-lg" alt="">
                        <form id="avatarForm" class="avatar-form">
                            <label class="btn btn-ghost file-btn">
                                Choose image
                                <input type="file" id="avatarInput" name="avatar" accept="image/*">
                            </label>
                            <span id="avatarFileName" class="hint">JPG, PNG, WEBP up to 2MB</span>
                            <button type="submit" id="avatarBtn" class="btn btn-primary" disabled>Upload avatar</button>
                        </form>
                    </div>

                    <form id="profileForm" class="card form">
                        <label>Full name
                            <input type="text" name="fullName" required>
                        </label>
                        <div class="form-row">
                            <label>Age
                                <input type="number" name="age" min="1" max="150">
                            </label>
                            <label>Gender
                                <select name="gender">
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </label>
                        </div>
                        <div class="form-row">
                            <label>Email
                                <input type="email" name="email" disabled>
                            </label>
                            <label>Account type
                                <input type="text" name="type" disabled>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- ================= MODAL (create / edit) ================= -->
    <dialog id="modal" class="modal">
        <form id="modalForm" class="form" method="dialog">
            <h2 id="modalTitle"></h2>
            <div id="modalFields"></div>
            <div class="modal-actions">
                <button type="button" id="modalCancel" class="btn btn-ghost">Cancel</button>
                <button type="submit" id="modalSubmit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </dialog>

    <!-- ================= TOASTS ================= -->
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
