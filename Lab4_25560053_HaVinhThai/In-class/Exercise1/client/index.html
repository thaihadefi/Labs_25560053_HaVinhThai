<!-- index.html - Web UI client -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Management - Client Web UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .filter-row {
            margin-top: 10px;
        }

        .alert {
            background: #d9534f;
            color: white;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .alert.success {
            background: #5cb85c;
        }

        .hidden {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #1F4E79;
            color: white;
        }

        td input {
            width: 90%;
        }

        .btn-delete,
        .btn-edit,
        .btn-save,
        .btn-cancel {
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            margin-right: 4px;
        }

        .btn-delete {
            background: #d9534f;
        }

        .btn-edit {
            background: #f0ad4e;
        }

        .btn-save {
            background: #5cb85c;
        }

        .btn-cancel {
            background: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Product Management (Client Web UI)</h2>
        <div id="message" class="alert hidden"></div>
        <form id="productForm">
            <input type="text" id="name" placeholder="Product name" required>
            <input type="number" id="price" placeholder="Price (VND)" required>
            <input type="text" id="category" placeholder="Category">
            <button type="submit">Add product</button>
        </form>
        <div class="filter-row">
            <label for="categoryFilter"><strong>Filter by Category:</strong></label>
            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
        </div>
        <table id="productTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price (VND)</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>

</html>
